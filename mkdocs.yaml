site_name: CQL2 JSON Pydantic
site_description: Pydantic v2 models for building CQL2 JSON filters.
site_url: https://terradue.github.io/cql2json-pydantic/
repo_url: https://github.com/Terradue/cql2json-pydantic
repo_name: cql2json-pydantic
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - First steps: tutorials/first-steps.md
  - How-to guides:
      - Overview: how-to/index.md
      - Install: how-to/install.md
      - Build a filter: how-to/build-filter.md
      - Build geometries: how-to/build-geometries.md
  - Reference:
      - Overview: reference/index.md
      - API: reference/api.md
  - Explanation:
      - Overview: explanation/index.md
      - Architecture: explanation/architecture.md

theme:
  name: readthedocs
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
